<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The four presences about the throne</title>
<!--
  An emblem made for The Host, a door of The Powers portal of Three Magi Press
  (/powers/host): an original composition, not a copy of any historical object,
  seal or device, built from these traditional motifs. Bible quotations are
  from the KJV; everything else is paraphrased.
    The four presences. 1 Enoch 40:1-2: a multitude beyond number stood before
      the Lord of Spirits, and on his four sides the seer saw four presences.
      The four places are fixed; the names that fill them are not. Michael,
      Raphael, Gabriel and Phanuel (1 Enoch 40:9). Michael, Uriel, Raphael and
      Gabriel (1 Enoch 9:1 in the Greek of Syncellus; the Greek Panopolitanus
      and the Aramaic 4QEn-b read Sariel). In Pirqe de-Rabbi Eliezer 4 the
      ministering angels stand in four camps, Michael on the right, Gabriel on
      the left, Uriel before and Raphael behind, with the Shekhinah in the
      midst; Michael, Gabriel, Raphael and Uriel became the usual four of later
      Jewish and Christian writing. Islam also counts four archangels, but the
      Qur'an names only Jibril and Mikal (2:98) and leaves the angel of death
      unnamed (32:11); Israfil and 'Azra'il come from hadith and later
      tradition. So the drawing names none and gives none a quarter: each
      presence is only a pair of spread wings, without face, body or name, and
      the four are identical.
    The wings. The Hebrew Bible gives wings to the seraphim (Isaiah 6:2), to
      Ezekiel's living creatures (called cherubim in Ezekiel 10) and to the
      women of Zechariah 5:9, and never plainly to the messengers (Daniel 9:21
      is disputed); winged angels are the convention of later Jewish and
      Christian art, and Qur'an 35:1 speaks of angels as messengers having
      wings, two, three and four. Ezekiel 1:9, 11: their wings "were joined one
      to another"; here the two wings of each presence are joined at the root,
      and the four pairs stand apart so the light passes between them.
    The throne-wheel. Daniel 7:9: "his throne was like the fiery flame, and his
      wheels as burning fire"; 1 Enoch 14:18: the wheels of the lofty throne
      were as the shining sun; Ezekiel 1:16: "a wheel in the middle of a
      wheel"; Ezekiel 1:18 and 10:12: the rims "full of eyes round about".
      Drawn as a pale felloe set with eight eyes, a second wheel inside it,
      no spokes (no source gives the throne-wheel spokes), and a glory of
      straight rays for light alternating with wavy rays for fire, as painted
      and heraldic suns alternate them. In 1 Enoch 61:10 and 71:7 the Ophanim,
      the wheels themselves, are counted with the cherubim and seraphim among
      the host, so the wheel belongs to the host too.
    The point of light at the hub: the Lord of Spirits, drawn without figure,
      as a star of eight long and eight short rays in a glow.
    The multitude. A row of a hundred fine beads inside the outer ring, the
      two together making the double ring of the set: Daniel 7:10,
      "thousand thousands ministered unto him, and ten thousand times ten
      thousand stood before him", and 1 Enoch 40:1.
  The drawing's own: the feathers and coverts, the number of eyes, rays and
  beads (which mean nothing), the four soft shafts of light between the
  presences, the star's form and every proportion. Gold only (#ecd9ae,
  #c9a86a, #a8874f and lighter tints of the pale gold, on #0d0b0a), no accent
  colour and no lettering, on a soft dark ground that lets it read over a
  photograph.
-->
