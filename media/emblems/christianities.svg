<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The parted fire: one fire, twelve tongues</title>
<!--
  The parted fire. An original emblem drawn in 2026 for the Christianities portal
  of Three Magi Press. It is not a historical object and not the badge of any
  church, order or movement.
  Made from:
  - Acts 2:1-11. "And there appeared unto them cloven tongues like as of fire, and
    it sat upon each of them" (2:3, KJV); Greek diamerizomenai glossai hosei pyros,
    tongues as of fire being parted among them. Each hearer heard them "in his own
    language" (2:6, 2:8). Acts is in every Christian canon, the 22-book Syriac
    Peshitta included, and every ancient communion, and nearly every church, keeps
    Pentecost. The Fathers read the day as Babel reversed: one confession heard in
    many tongues. To read the parting as plurality present from the start is this
    emblem's own reading, not a claim about the text.
  - The Byzantine Pentecost icon: heaven as a segment of concentric bands at the
    top edge, with rays going down, one to each of the company. Here the bands
    darken toward the centre, the Palaiologan way of showing uncreated light as
    darkness, with a few stars as on many heaven segments. The count of twelve is
    the icon's, which usually seats Paul at the head with Peter, and often Luke and
    Mark; in Acts the Twelve are completed by Matthias (1:26), and the "all" of 2:1
    may be the hundred and twenty of 1:15. Tongues over each of the company are
    already in the Syriac Rabbula Gospels (586).
  - No dove (Acts 2 has wind and fire, not a dove), no cross, and gold only: red
    for Pentecost is a Latin usage and Slavic Orthodox vest in green, so the fire
    takes no church's colour. The image is the shared feast, not the badge of the
    Pentecostal movement, and it is unrelated to the United Methodist cross and
    flame.
  Geometry: the twelve rays leave one point, the bright source at (200,32), which
  is the centre of the heaven circles. The tongue tips lie on a circle through
  that point (centre (200,162), radius 130), 20 degrees of arc apart, so by the
  inscribed-angle theorem the rays leave the source at equal angles of 10 degrees.
  Inside the dark centre of heaven the rays are seen converging; under the two
  outer bands they are hidden; below heaven they come out. Each ray tapers from
  1.6 to 4.5 units and stops 7 short of its own tongue. The twelve tongues are one
  shape, the right six its mirror image, each leaning toward the source in
  proportion to its ray's angle with the tip curling back toward upright, and each
  with an ivory inner tongue rising into its neck. Nothing stands on the axis
  below the source.
-->
