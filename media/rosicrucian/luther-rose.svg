<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>Luther’s seal, the Luther rose</title>
<desc>A black cross in a heart of its natural red colour; the heart set in the middle of a white rose of five petals; the rose on a sky-blue field; a gold ring round the field. Tinctures as Luther gives them in his letter to Lazarus Spengler, 8 July 1530.</desc>
