<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The arms of Andreae</title>
<desc>Argent, a saltire gules between four roses gules: on a silver shield a red St Andrew’s cross running to the edges, with a red rose in each of its four angles. The arms of the theologian Jakob Andreae, borne after him by his grandson Johann Valentin Andreae. Tinctures as Siebmacher’s Bürgerliche Wappen, vol. 9, is quoted as giving them for Jakob Andreae; a painted panel from Schloss Sinzig shows the field gold.</desc>
