<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The tablet, the scroll and the codex</title>
<!--
  An emblem made for The Texts, a door of The Powers portal of Three Magi Press
  (/powers/texts): an original composition, not a copy of any seal or historical
  object, built from these traditional motifs.
    The three bodies the written word has taken in the works on this shelf, each
    in a medallion of its own, the three medallions equal, drawn as fine rings
    and packed as three equal circles in a circle, so that none stands over
    another; set roughly in
    the order of their first use, the tablet above, then the roll and the codex.
    The clay tablet (above): a cushion-shaped tablet with a slightly convex face,
      as Mesopotamian tablets are, pressed with rows of wedges in the manner of
      Neo-Assyrian cuneiform (horizontal and vertical wedges and the corner wedge,
      the Winkelhaken), written in lines from left to right, with faint ruled
      lines between the rows as scribes often ruled them; the copies of Enuma
      Elish from Ashurbanipal's library at Nineveh (7th century BCE) are tablets
      of this kind. The wedges are arranged as cuneiform is but spell no text.
    The scroll (lower left): the book-roll of Egypt, Greece, Rome and Judaea, open
      for reading, the sheet wound from one roll onto the other as readers hold
      it in Roman paintings and reliefs; each roll is as tall as the sheet, its
      top end showing the spiral of the wound sheet, and the writing runs in
      columns across the sheet. No rods or knobs: a Greek or Latin roll had at
      most one rod (umbilicus) at its end; two rods with handles are the form of
      the Torah scroll. The Aramaic copies of the Book of the Watchers found at
      Qumran are fragments of rolls, and several of the Greek Magical Papyri are
      rolls.
    The codex (lower right): leaves folded and sewn into a cover, the form that
      displaced the roll between the 2nd and 4th centuries CE and carried most
      of these works (the Nag Hammadi codices, papyrus, 4th century; the Cologne
      Mani Codex, parchment, 4th-5th century), and in which nearly all the later
      ones have come down. Shown open, one column of writing on each leaf, the
      lines following the curve of the leaf; the last line on the left leaf
      starts at the outer margin and the one on the right leaf at the gutter, as
      writing from left to right falls. The edges of the leaves and the cover
      show beneath.
    The sign AN at the centre, where the three medallions nearly meet, large
      enough to lie across their rims like a clasp, the roll and the codex
      standing a little aside to give it room; in the archaic form used in the
      emblem of The Powers: four crossing strokes, eight even rays, here with
      fine rays of light between them that show only where the medallions
      part, and a soft glow. In cuneiform it is
      the sign written before the names of gods (read dingir); here it stands
      for what all three bodies carry, the names of the powers.
    The double ring of the portal's emblems, with the same radii and widths.
  The drawing's own: the medallions and their packing, the proportions of each
  body, the number of lines and columns, the order of the wedges and the
  shading; gold only, on a soft dark ground that lets it read over a photograph.
-->
