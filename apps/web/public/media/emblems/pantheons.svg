<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The household of the gods: a tree from the first waters</title>
<!--
  An emblem made for The Pantheons, a door of The Powers portal of Three Magi Press
  (/powers/pantheons): an original composition, not a historical object or the seal of
  any body, built from these traditional motifs. Quotations are paraphrased.
    The tree. A genealogy drawn as a tree, grown here into the world tree that holds the
      household of the gods: the ash Yggdrasil, where the gods hold their court every day
      (Snorri, Gylfaginning 15), and the Rigveda's question, what wood and what tree it was
      from which heaven and earth were fashioned (RV 10.81.4).
    The two stems, one pale gold and one deep gold, rising apart and crossing once, the pale
      over the deep: the first pair from whom a family of gods descends. Apsu and Tiamat
      mingle their waters and the gods are born within them (Enuma Elish I.1-9); Hera calls
      Okeanos the origin of the gods and Tethys their mother (Iliad 14.201); Heaven and Earth
      are hymned as the pair whose sons are gods (devaputre, RV 1.159.1); Izanagi and Izanami
      stir the brine and bear the islands, the pair from whom most of the kami descend
      (Kojiki I; the first kami come before them). Neither stem is named: every family names
      its own pair. Each crosses into the other's side of the crown, so the whole household
      holds both, and their two golds meet only in the crown.
    The waters at the root, from which most of these families rise: Apsu and Tiamat; Nun,
      out of which Atum rose at Heliopolis; the brine of the Kojiki; the waters on which,
      in the Ife accounts, earth was poured from a snail shell to make the first land.
    The light at the crossing: the marriage as the hearth of the house. In Plato's Phaedrus
      (247a) Hestia, the hearth, alone stays at home in the house of the gods.
    The crown: the household, branching as a genealogy branches, two boughs to four limbs
      to eight twigs, with a round knot at each fork as on a family chart. Eight stars, for
      the eight great offices by which the page's Table of Correspondences reads every family
      (sky, storm, sun, love, war, wisdom, underworld, threshold): a division of labour.
    Each star is the sign AN, in cuneiform both "sky" and "god", written before every
      divine name; drawn as on the Powers emblem, four crossing strokes, eight equal rays,
      with the same proportions as its small signs.
    Seniority: the stars are largest and palest at the head, smaller and deeper down the
      sides. The Babylonian god-list An = Anum enters each great god with spouse, children
      and household after him; in Plato's Phaedrus (247a) the gods go each in the rank
      assigned to him, each doing his own work.
    The head pair: the two largest stars side by side at the top, where a couple heads the
      house: Zeus and Hera; El and Athirat (mother of the seventy sons, the gods, in the Baal
      cycle of Ugarit); Odin and Frigg; Dyaus and Prithivi, the Vedic pair (RV 1.159.1); in
      a Shaiva household, Shiva and Parvati. Some families have no such couple at their
      head: Ahura Mazda has no consort, and Olodumare stands alone above the orisha.
    Twelve beads on a faint band inside the ring, one for each family the page sets out,
      from Sumer and Akkad to the Fifth Sun.
    A double ring, the bound of the house, as on the Powers emblem.
  The drawing's own: the number and set of the branches, the knots, the single crossing,
  the sizes and shades of the stars, the three lines of water, the beads and every
  proportion; no star on the crown's axis and no count of ten, so that it is not taken for
  another tree. Gold only: pale gold #ecd9ae, gold #c9a86a, deep gold #a8874f, on #0d0b0a.
  No lettering.
-->
