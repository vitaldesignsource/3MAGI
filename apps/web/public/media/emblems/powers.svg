<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The air full: the sign AN and two messengers</title>
<!--
  An emblem made for The Powers portal of Three Magi Press (/powers): an
  original composition, not a historical object, built from these traditional
  motifs.
    The sign AN in its archaic form: four crossing strokes, a star of eight
      equal rays, drawn as even strokes rather than as a faceted star. In
      Sumerian and Akkadian cuneiform it is the determinative written before
      divine names (read dingir, "god"), and it also means an, "sky".
      Here large, at the centre.
    Two messengers (Greek angelos, Hebrew mal'akh), each a pair of spread wings
      with the same sign, small, for a body. Winged spirits are themselves
      Mesopotamian (the winged apkallu of the Assyrian palace reliefs), and
      Egyptian and biblical imagery also gives wings to the beings between.
    The traffic both ways: the upper messenger lets a ray down, the lower one
      carries a flame up, and the gold shades from pale above to deep below.
      Diotima in Plato, Symposium 202e: the daimonic "interprets and ferries"
      to the gods what comes from men and to men what comes from the gods,
      prayers and sacrifices from below, commands and returns from above.
      Genesis 28:12: the angels of God ascending and descending.
    The sign repeated small in the open air at the sides, for the many gods.
    A double ring, the bound of the heavens.
  The drawing's own: the shape and number of the feathers, the set of the
  wings, the ray and the flame, the placing of the small signs, the shading and
  every proportion; gold only, on a soft dark ground that lets it read over a
  photograph.
-->
