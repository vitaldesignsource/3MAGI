<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The bond of the whole: the knot of Herakles</title>
<!--
  An emblem made for The Daimons, a door of The Powers portal of Three Magi Press
  (/powers/daimons): an original composition, not a historical object and not the
  seal or device of any body, built from these traditional motifs.
    The bond. Diotima in Plato, Symposium 202d-203a (paraphrased): everything
      daimonic is between god and mortal; it interprets and ferries to the gods
      what comes from men and to men what comes from the gods, prayers and
      sacrifices from below, commands and returns from above; being in the middle
      of both it fills the gap, so that the whole is bound together with itself
      (to pan auto hautoi syndedesthai, 202e); god does not mix with man (203a).
      Drawn as a knot at the centre of the ring, the ring standing for the whole.
    The two cords. A pale cord let down from the upper arc: in Iliad 8.18-27 Zeus
      dares the gods to hang a golden cord from heaven (seiren chryseien ex
      ouranothen) and pull on it. Macrobius, Commentary on the Dream of Scipio
      1.14.15, reads Homer's golden chain as the unbroken linking of all things
      from the highest god down to the lowest dregs. A deep gold cord is raised
      from the lower arc to meet it. They hold each other and never merge.
    The knot: two hooked bights, the topology of the reef or square knot, drawn
      after the knot of Herakles on Hellenistic diadems (opened out and set
      upright here, not drawn compact as the goldsmiths made it). The pale bow
      lies over both parts of the deep cord, the deep bow passes under both parts
      of the pale cord, and at the two middle crossings the deep cord lies over.
      Were a bow to pass over one part of the other cord and under the other part,
      it would be the granny. Checked by computation: joined working end to
      working end and standing part to standing part, the crossings as drawn
      close into the square knot (Jones polynomial), not the granny. Pliny calls
      it the knot of Hercules (nodus Herculis) and reports its healing use:
      wounds bound with it heal much faster, and a girdle tied with it daily is
      said to do good (Natural History 28.63-64, paraphrased). Hellenistic
      goldsmiths set it at the centre of diadems, belts and necklaces, where it is
      usually read as protective. Hesiod's golden race became daimones, "noble,
      averters of evil, guardians of mortal men" (our translation of Works and
      Days 122-123 as Plato quotes it at Cratylus 398a; the word alexikakoi,
      "averters of evil", is in Plato's quotation, not in the Hesiod manuscripts).
    The exchange. In the knot the pale cord from above makes the lowest bow and
      the deep cord from below the highest: what comes down is carried furthest
      down, what rises is carried highest. This is the drawing's own figure for
      Diotima's ferrying, and for the turn this door records, the middle spirits
      pushed down the ladder. Also the drawing's own reading, not a source: the
      same knot carries the door's later sense, the daimons bound, as spirits are
      bound in the Testament of Solomon and the grimoires.
    The sign AN above, the eight-rayed cuneiform sign written before divine names
      (read dingir, "god"), drawn as on the Powers emblem: the gods.
    A flame below, of the same family as the Powers emblem's flame, with a pale
      inner tongue: what rises from mortals, the sacrifices of Diotima's
      definition.
    The double ring of the Powers emblem, the bound of the whole; the four cords
      run under both rings.
  The drawing's own: the knot as the daimonic, the cords run under the ring, the
  bows' exchange of height read as the door's turn, the twisted-gold-wire
  texture, the sixteen fine rays in the glow of the AN, the soft light in the
  space the two bows enclose, and every proportion. No wings, horns or human
  figure: the daimon is shown neither as angel nor as devil. Gold only, pale above
  shading to deep below, on a soft dark ground that lets it read over a
  photograph. No lettering.
-->
