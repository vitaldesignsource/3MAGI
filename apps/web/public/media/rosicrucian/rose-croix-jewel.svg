<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The jewel of the Rose-Croix degree (1858)</title>
<desc>Follows the description of the jewel printed in a Masonic magazine of 1 June 1858: crowned compasses opened on an arc of a sixteenth of a circle, a passion cross ‘formed of rubies’ between the legs with a full-blown rose at its centre and its stem twined round the lower limb, and a pelican feeding her young at the foot. Only the obverse is drawn. The crown’s form, the leaves, the number of young and every proportion except the angle are the drawing’s own. The cipher on the arc is left out because its letters are not established. The cross is red, for the rubies of the 1858 text; everything else is gold on dark.</desc>
<!--
  After the description of the jewel of the Rose Croix degree in the London
  Freemasons' Magazine series (masonicperiodicals.org, series 'mmr', issue of
  1 June 1858, p. 195; the article's title and the masthead of that issue not
  verified). NO JEWEL WAS SEEN; drawn from the 1858 text only.
  From the text: a crown; compasses opened on an arc of a sixteenth of a circle
    (22.5 degrees); between the legs a passion cross 'formed of rubies', a
    full-blown rose at its centre, the stem twined round the lower limb; at the
    foot a pelican wounding her breast to feed her young. The obverse only.
  The drawing's own: the crown as a plain coronet of five points (a description
    of 3 July 1869 in the same series, p. 12, gives 'a seven pointed antique
    crown', and the compasses at 60 degrees); five petals; three leaves; three
    young (the number is not given; one museum example shows seven); the nest of
    twigs; every proportion except the angle. The cross is plain red: the rubies
    are not drawn as separate stones.
  Construction (page coordinates). Hinge (200,85), 22 across. Legs 270 long,
    12 wide, each 11.25 degrees from the vertical; points (147.3,349.8) and
    (252.7,349.8). Arc: a band 12 thick on the circle about the hinge whose
    radius is the leg length, from point to point (22.5 degrees), its middle
    line at y 355. Crown 80 wide, 45 tall, base at y 72.5 on the hinge. Cross:
    upright x 194-206 from y 130 down to the arc behind the nest, crossbar 80
    long at y 184-196; in front of the legs. Rose 37 across at the crossing.
    Stem: a helix of two and a half turns round the lower limb, y 201-243,
    passing in front of the cross going right and behind it going left, its end
    hidden behind the cross. Pelican facing left between the legs, centred on
    the nest: body y 283-317, wings half raised to y 246, the bill reaching
    down to pierce the breast, three drops falling. Nest of twigs 60 wide on
    the middle of the arc, y 330-350; three young in it, beaks open upward.
  Left out: the password in cipher on the arc (its letters are not established);
    the reverse (an eagle in the pelican's place).
  Uncertain: whether eighteenth-century jewels already had this layout; museum
    and sale examples vary (the rose at the hinge, or a rose over the pelican in
    place of the cross).
  Colour: the cross red, for the rubies of the 1858 text; all else gold. The
    ground is left transparent: overlaps are parted by cut gaps, not by dark
    outlines, so the drawing sits on any ground.
-->
