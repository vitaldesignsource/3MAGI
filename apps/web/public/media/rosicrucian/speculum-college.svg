<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The college on wheels (1618)</title>
<desc>Follows published descriptions of the plate, which was not seen: a fortified building on a wheeled base, with wings, VENITE DIGNI over its arched door and IESVS NOBIS OMNIA over the two windows above. The crenellated top, the number of wheels, the set of the wings and every proportion are the drawing’s own. The hand and rope, the two stars and the rose and cross are left out, since each rests on a single description that could not be checked. So are the name Collegium Fraternitatis, whose place on the plate is not established, the figures round the building and the landscape. The engraving’s black becomes gold.</desc>
<!--
  After the engraved plate of the Collegium Fraternitatis in [Daniel Mögling, as]
  Theophilus Schweighardt Constantiensis, Speculum sophicum Rhodostauroticum (1618;
  Frankfurt in the Bodleian and NLS catalogues, Oppenheim for Johann Theodor de Bry
  in Ouroboros Press's account). Reproduced in Frances A. Yates, The Rosicrucian
  Enlightenment (London, 1972), as 'The Invisible College of the Rose Cross
  Fraternity'; studied in Uwe Maximilian Korn, '"Bilderfahrzeug" of the
  Rosicrucians' (2023).
  THE PLATE WAS NOT SEEN. Drawn only from what the published descriptions agree on:
    a fortified building of dressed stone on a wheeled base, with a pair of wings;
    a round-headed door, VENITE DIGNI on the wall just above its arch;
    two round-headed windows above it, IESVS NOBIS OMNIA above them.
  The drawing's own: the crenellated parapet (a reading of "fortified"; the roof
  form is not established), the string course under it, the coursing of the
  masonry (carried on behind both inscriptions, which are lettered across ordinary
  courses of the same bond; the head joints under the letters are not drawn), the
  arch and jamb stones of the door, the platform, the number of wheels
  (two) and of spokes (eight), the set of the wings (springing from the upper
  walls, rising outwards at about 45 degrees), the letterforms and every proportion.
  Left out: the hand from a cloud and its rope; the stars with a serpent-bearer and
  a swan; a separate rose and cross on the building (each on a single or unidentified
  description); the name Collegium Fraternitatis, whose place on the plate is not
  established; the figures round the building, the landscape and any other motto.
  Building 150 x 190, its base (the platform, 190 x 18) ending at y 320;
  door 40 x 60; windows centred at y 194; wheels 50 across; wings about 70 long.
  Engraved in black; one gold here, the weight of line alone varied.
-->
