<linearGradient id="relief" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecd9ae"/><stop offset=".55" stop-color="#c9a86a"/><stop offset="1" stop-color="#c9a86a"/></linearGradient>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="90" y1="90" x2="310" y2="310"><stop offset="0" stop-color="#0d0b0a" stop-opacity=".9"/><stop offset=".45" stop-color="#c9a86a" stop-opacity="0"/><stop offset=".6" stop-color="#ecd9ae" stop-opacity="0"/><stop offset="1" stop-color="#ecd9ae" stop-opacity=".8"/></linearGradient>
<path id="cross" d="M195.4 120H204.6V163.4H248V172.6H204.6V282H195.4V172.6H152V163.4H195.4Z"/>
