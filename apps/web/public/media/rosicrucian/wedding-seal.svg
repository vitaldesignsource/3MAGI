<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The seal of the wedding invitation</title>
<desc>The little seal that closed the letter of invitation in the Chymische Hochzeit Christiani Rosencreutz (Strasbourg, 1616), the First Day: a delicate cross, with the inscription In hoc signo + vinces, as the German text gives it, the small cross standing between SIGNO and VINCES. Shown impressed in wax; the round form, the wax, the ruled band and the letterforms are the drawing’s.</desc>
