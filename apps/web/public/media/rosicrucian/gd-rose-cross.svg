<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>The Rose Cross lamen of the Golden Dawn</title>
<desc>A cross whose arms carry the elemental colours (yellow Air above, red Fire to the left, blue Water to the right, the four colours of Malkuth below), each arm ending in three lobes bearing Sulphur, Salt and Mercury and each bearing a pentagram; a white section on the lower arm bearing the planetary hexagram; plain white rays between the arms (their lettering omitted as unconfirmed); and at the centre a rose of twenty-two petals in rows of three, seven and twelve, with Heh uppermost and Lamed lowest in the outer row, and at its heart a white field with a small golden cross, a red rose of five petals and four green rays.</desc>
